# ideamans fork: `v<upstream>-i.<n>` のタグ（例 v1.12.0-i.1）を push すると ideamans-chrome-devtools-mcp を
# npm にそのまま公開する（承認待ちにしない）。dist-tag は常に latest（prerelease の形の版なので明示が要る）。
# npm の Trusted Publishing（OIDC）を使う。トークンの secret は使わない。
# npmjs.com のパッケージ設定で、このリポジトリの ideamans-publish.yml を Trusted Publisher
# （権限は publish）に登録してある前提。
# リリース: ideamans-fork で node scripts/ideamans-version.mjs bump → PR → git tag vX.Y.Z-i.N && git push origin vX.Y.Z-i.N
# （upstream のタグは chrome-devtools-mcp-vX.Y.Z の形なので `v*-i.*` とはぶつからない）
# 既に npm にある版なら何もしない。workflow_dispatch で起動すると、選んだブランチの package.json の版を出す。
# PR では、このファイル・版・スモークテストを変えたときだけ公開せずにビルドと tarball の確認までする。
# upstream の publish-to-npm-on-tag.yml（chrome-devtools-mcp と chrome-devtools を出す）は fork では使わない。
name: ideamans publish

on:
  push:
    tags:
      - 'v*-i.*'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ideamans-publish.yml
      - .release-please-manifest.json
      - package.json
      - src/version.ts
      - scripts/ideamans-*.mjs

permissions:
  contents: read

concurrency:
  group: ideamans-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ideamans/chrome-devtools-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # registry-url は付けない（OIDC では要らず、付けると NODE_AUTH_TOKEN を参照する設定が書かれる）
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Check the tag and the registry
        id: check
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # upstream の版のタグ（package.json の name が chrome-devtools-mcp のもの）を誤って出さない
          if [ "$name" != "ideamans-chrome-devtools-mcp" ]; then
            echo "::error::package.json の name が ideamans-chrome-devtools-mcp ではない（$name）"
            exit 1
          fi
          # provenance の検証は package.json の repository とこのリポジトリの一致を見る（違うと公開が E422 で落ちる）。
          # upstream の package.json は ChromeDevTools/chrome-devtools-mcp を指すので、fork では ideamans に替えてある
          node -e '
            const f = process.argv[1], want = "https://github.com/" + process.env.GITHUB_REPOSITORY
            const r = require(f).repository
            let u = (typeof r === "string" ? r : (r && r.url) || "").replace(/^git\+/, "").replace(/\.git$/, "")
            u = u.replace(/^git@github\.com:/, "https://github.com/").replace(/^(ssh|git):\/\/(git@)?github\.com\//, "https://github.com/").replace(/^github:/, "https://github.com/")
            if (!/^https:\/\//.test(u)) u = "https://github.com/" + u
            if (u.toLowerCase() !== want.toLowerCase()) {
              console.error(`::error::${f} の repository（${u}）が ${want} と一致しない`)
              process.exit(1)
            }' "$PWD/package.json"
          # 版は <upstream>-i.<n>。package.json・package-lock.json・src/version.ts（--version と serverInfo に出る）が
          # 揃っていて、upstream の版（.release-please-manifest.json）に基づくこと
          node scripts/ideamans-version.mjs check
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が package.json の version（$version）と一致しない"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "::notice::$name@$version は npm にある"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Sync DevTools dependencies
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: npm run gclient-sync

      # build ではなく bundle。build の出力は依存を同梱せず、公開すると起動しない（0.21.0 がそうだった）
      - name: Build and bundle
        if: steps.check.outputs.skip != 'true'
        run: npm run bundle
        env:
          NODE_ENV: 'production'
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Verify package contents
        if: steps.check.outputs.skip != 'true'
        run: npm run verify-npm-package

      # 公開する tarball を空のプロジェクトに入れ、MCP が起動して performance_analyze_file を出すか確かめる
      # （tools/list まではブラウザを起動しない）
      - name: Smoke test the packed tarball
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/smoke"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/smoke"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          node "$GITHUB_WORKSPACE/scripts/ideamans-smoke.mjs" node_modules/ideamans-chrome-devtools-mcp/out/Default/gen/src/bin/chrome-devtools-mcp.js \
            "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"

      # Trusted Publishing には npm 11.5.1 以上が要る
      - name: Update npm
        if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@latest

      # 版が prerelease の形（-i.N）なので、npm は --tag 無しでは公開しない。latest を明示して
      # npx ideamans-chrome-devtools-mcp@latest が新しい版を取るようにする（1.12.1 より semver で小さくても latest になる）
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: npm publish --access public --ignore-scripts --tag latest
